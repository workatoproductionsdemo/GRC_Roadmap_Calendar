:root{
  --bg:#111010; --card:#1A1717; --surface:#282525;
  --text:#FFFFFF; --text2:rgba(255,255,255,.85); --muted:rgba(255,255,255,.62);
  --border:rgba(103,234,221,.22); --border-strong:rgba(103,234,221,.5);
  --accent:#67EADD; --head:#22DBC8; --on-accent:#111010;
  --grid:rgba(255,255,255,.07); --row-hover:rgba(103,234,221,.08); --row-sel:rgba(103,234,221,.14);
  --today:#F59E0B;
  --lw:270px;
  --font:"Mr Eaves XL Modern","Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#F5F6F8; --card:#FFFFFF; --surface:#EDEEF1;
    --text:#111010; --text2:#282525; --muted:#5a5a5a;
    --border:rgba(62,162,168,.35); --border-strong:#3EA2A8;
    --accent:#3EA2A8; --head:#23767c; --on-accent:#111010;
    --grid:rgba(0,0,0,.08); --row-hover:rgba(62,162,168,.08); --row-sel:rgba(62,162,168,.16);
    --today:#B45309; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F5F6F8; --card:#FFFFFF; --surface:#EDEEF1;
  --text:#111010; --text2:#282525; --muted:#5a5a5a;
  --border:rgba(62,162,168,.35); --border-strong:#3EA2A8;
  --accent:#3EA2A8; --head:#23767c; --on-accent:#111010;
  --grid:rgba(0,0,0,.08); --row-hover:rgba(62,162,168,.08); --row-sel:rgba(62,162,168,.16);
  --today:#B45309; color-scheme:light;
}
:root[data-theme="dark"]{color-scheme:dark}

*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.45}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{max-width:90rem;margin:0 auto;padding:1.5rem 1.25rem 3rem}

/* header */
.top{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;justify-content:space-between;margin-bottom:1.25rem}
.brand{display:flex;align-items:center;gap:.9rem}
.brand img{width:40px;height:40px;display:block}
h1{margin:0;font-size:2rem;line-height:1.15;font-weight:400;color:var(--head)}
.sub{margin:.15rem 0 0;color:var(--muted);font-size:1rem}
.tag{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--border-strong);border-radius:.375rem;padding:.25rem .5rem;font-size:.8rem;color:var(--text2)}

/* summary */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.75rem;margin-bottom:1.25rem}
.metric{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--c,var(--accent));border-radius:.75rem;padding:.8rem 1rem}
.metric .k{color:var(--muted);font-size:.9rem}
.metric .v{font-size:1.9rem;font-weight:700;line-height:1.1;margin:.1rem 0}
.metric .n{color:var(--text2);font-size:.88rem;min-height:1.2em}

/* controls */
.controls{display:grid;gap:.75rem;margin-bottom:1rem}
.seg{display:flex;flex-wrap:wrap;gap:.4rem}
.seg button{background:transparent;border:1px solid var(--border);border-radius:.5rem;padding:.4rem .8rem;cursor:pointer;color:var(--text2)}
.seg button:hover{border-color:var(--border-strong)}
.seg button[aria-pressed="true"]{background:linear-gradient(135deg,#67EADD,#22DBC8);color:var(--on-accent);border-color:transparent;font-weight:700}
.seg button small{opacity:.75;margin-left:.35rem;font-size:.78rem}
.chips button{display:inline-flex;align-items:center;gap:.45rem;padding:.3rem .65rem;font-size:.88rem}
.chips .dot{width:.65rem;height:.65rem;border-radius:50%;background:var(--c);flex:none}
.chips button[aria-pressed="true"]{background:var(--surface);color:var(--text);border-color:var(--c);font-weight:700}
.row-ctl{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.field{background:var(--card);border:1px solid var(--border);border-radius:.5rem;padding:.45rem .7rem;min-width:11rem}
.field:focus-visible{border-color:var(--accent)}
.link{background:none;border:none;color:var(--accent);cursor:pointer;text-decoration:underline;padding:.3rem}

/* gantt */
.gantt{background:var(--card);border:1px solid var(--border);border-radius:.75rem;overflow:hidden}
.scroll{overflow-x:auto}
.plot{position:relative;min-width:960px}
.hdr{display:grid;grid-template-columns:var(--lw) 1fr;border-bottom:1px solid var(--border);background:var(--surface)}
.hdr .corner{position:sticky;left:0;z-index:5;background:var(--surface);padding:.6rem 1rem;color:var(--muted);font-size:.9rem;display:flex;align-items:flex-end}
.hdr .cols{display:flex;flex-direction:column}
.qrow,.mrow{display:flex}
.qrow>div{padding:.35rem .6rem;border-left:1px solid var(--border);font-weight:700;font-size:.92rem;white-space:nowrap;overflow:hidden}
.qrow>div span{font-weight:400;color:var(--muted);margin-left:.4rem}
.qrow>div.cur{color:var(--head)}
.mrow>div{padding:.3rem .6rem;border-left:1px solid var(--grid);color:var(--text2);font-size:.85rem;border-top:1px solid var(--grid)}
.gl{position:absolute;top:0;bottom:0;width:1px;background:var(--grid);pointer-events:none;z-index:1;left:calc(var(--lw) + (100% - var(--lw)) * var(--p))}
.today{position:absolute;top:0;bottom:0;width:2px;background:var(--today);pointer-events:none;z-index:3;left:calc(var(--lw) + (100% - var(--lw)) * var(--p))}
.today::before{content:"Today";position:absolute;top:.15rem;left:4px;background:var(--today);color:#111010;font-size:.7rem;font-weight:700;padding:0 .3rem;border-radius:.2rem;line-height:1.3}

.group{position:relative;display:flex;align-items:center;gap:.5rem;padding:.5rem 1rem;background:var(--bg);border-bottom:1px solid var(--grid);border-top:1px solid var(--grid);font-weight:700;font-size:.92rem}
.group>span{position:sticky;left:1rem;display:inline-flex;align-items:center;gap:.5rem}
.group .dot{width:.7rem;height:.7rem;border-radius:2px;background:var(--c)}
.group .ct{color:var(--muted);font-weight:400}

.row{display:grid;grid-template-columns:var(--lw) 1fr;width:100%;text-align:left;background:transparent;border:none;border-bottom:1px solid var(--grid);padding:0;cursor:pointer;position:relative}
.row:hover{background:var(--row-hover)}
.row[aria-expanded="true"]{background:var(--row-sel)}
.row .lab{position:sticky;left:0;z-index:4;display:block;background:var(--card);padding:.6rem 1rem;border-right:1px solid var(--border)}
.row:hover .lab{background:color-mix(in srgb,var(--row-hover),var(--card))}
.row[aria-expanded="true"] .lab{background:color-mix(in srgb,var(--row-sel),var(--card));box-shadow:inset 3px 0 0 var(--accent)}
.lab .nm{display:block;font-size:.98rem;line-height:1.25;color:var(--text)}
.lab .fw{display:block;font-size:.78rem;color:var(--muted);margin-top:.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{position:relative;display:block;min-height:3.1rem}
.bar{position:absolute;top:50%;transform:translateY(-50%);height:1.55rem;min-width:8px;border-radius:.375rem;background:var(--c);z-index:2;display:flex;align-items:center;padding:0 .5rem;color:#111010;font-size:.76rem;font-weight:700;white-space:nowrap;overflow:hidden}
.bar.ind{background:repeating-linear-gradient(135deg,var(--c) 0 7px,color-mix(in srgb,var(--c) 50%,transparent) 7px 14px);border:1px dashed var(--c)}
.bar.done{opacity:.45}
.bar.now{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--c)}
.empty{padding:2.5rem 1rem;text-align:center;color:var(--muted)}
.legend{display:flex;gap:1.25rem;flex-wrap:wrap;padding:.7rem 1rem;border-top:1px solid var(--border);font-size:.84rem;color:var(--muted);background:var(--card)}
.legend i{display:inline-block;width:1.6rem;height:.7rem;border-radius:.25rem;background:var(--accent);vertical-align:middle;margin-right:.4rem}
.legend i.d{opacity:.45}
.legend i.ind{background:repeating-linear-gradient(135deg,var(--accent) 0 5px,color-mix(in srgb,var(--accent) 50%,transparent) 5px 10px);border:1px dashed var(--accent)}
.legend i.n{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--accent)}
.legend i.t{width:3px;height:.9rem;border-radius:0;background:var(--today)}

/* frameworks strip */
.fws{background:var(--card);border:1px solid var(--border);border-radius:.75rem;padding:.9rem 1rem;margin-bottom:1rem;display:grid;gap:.6rem}
.fws h2{margin:0;font-size:1.1rem;font-weight:700}
.fws .hint{margin:0;color:var(--muted);font-size:.88rem}
.fg{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem}
.fg .gl2{color:var(--muted);font-size:.85rem;min-width:9.5rem;display:inline-flex;align-items:center;gap:.4rem}
.fg .gl2 i{width:.65rem;height:.65rem;border-radius:2px;background:var(--c)}
.fwb{background:transparent;border:1px solid var(--c);border-radius:.375rem;padding:.2rem .55rem;font-size:.85rem;cursor:pointer;color:var(--text)}
.fwb:hover{background:var(--surface)}
.fwb[aria-pressed="true"]{background:var(--c);color:#111010;font-weight:700}

/* dates to be confirmed */
.tbc{margin-top:1rem;background:var(--card);border:1px solid var(--border);border-radius:.75rem;padding:.9rem 1rem}
.tbc h2{margin:0 0 .15rem;font-size:1.1rem;font-weight:700}
.tbc p{margin:0 0 .6rem;color:var(--muted);font-size:.88rem}
.tbcrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:.25rem 1rem;width:100%;text-align:left;background:transparent;border:none;border-top:1px solid var(--grid);padding:.6rem .3rem;cursor:pointer}
.tbcrow:hover{background:var(--row-hover)}
.tbcrow[aria-expanded="true"]{background:var(--row-sel)}
.tbcrow .nm{display:flex;align-items:center;gap:.5rem}
.tbcrow .dot{width:.65rem;height:.65rem;border-radius:2px;background:var(--c);flex:none}
.tbcrow .cd{color:var(--muted);font-size:.88rem}
@media (max-width:760px){.tbcrow{grid-template-columns:1fr}}

/* detail panel */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.open{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--card);border-left:1px solid var(--border-strong);z-index:21;transform:translateX(102%);transition:transform .22s ease;overflow-y:auto;padding:calc(1.25rem + env(safe-area-inset-top,0px)) 1.5rem calc(2rem + env(safe-area-inset-bottom,0px))}
.panel.open{transform:none}
.panel .close{position:absolute;top:calc(.8rem + env(safe-area-inset-top,0px));right:1rem;background:transparent;border:1px solid var(--border);border-radius:.5rem;padding:.35rem .7rem;cursor:pointer;color:var(--text2)}
.panel .close:hover{border-color:var(--border-strong)}
.panel h2{margin:.6rem 2.5rem .4rem 0;font-size:1.75rem;line-height:1.15;font-weight:400;color:var(--head)}
.panel .lead{color:var(--text2);margin:0 0 1rem}
.panel h3{margin:1.4rem 0 .5rem;font-size:1.1rem;font-weight:700;color:var(--text)}
.badges{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:1.5rem}
.badge{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--c,var(--border-strong));border-radius:.375rem;padding:.2rem .5rem;font-size:.8rem;color:var(--text)}
.badge .dot{width:.55rem;height:.55rem;border-radius:50%;background:var(--c,var(--accent))}
.badge.solid{background:var(--c);color:#111010;font-weight:700;border-color:transparent}
.panel ul{margin:0;padding-left:1.15rem;color:var(--text2)}
.panel li{margin:.3rem 0}
.win{display:grid;grid-template-columns:1fr auto;gap:.25rem .75rem;align-items:center;padding:.6rem .8rem;border:1px solid var(--border);border-radius:.5rem;margin-bottom:.5rem;border-left:4px solid var(--c)}
.win .when{font-weight:700}
.win .len{color:var(--muted);font-size:.85rem}
.team{padding:.6rem .8rem;background:var(--surface);border-radius:.5rem;margin-bottom:.5rem}
.team b{display:block}
.team span{color:var(--text2);font-size:.92rem}
.kv{display:grid;grid-template-columns:7.5rem 1fr;gap:.35rem .75rem;color:var(--text2)}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.fine{margin-top:1.5rem;color:var(--muted);font-size:.8rem}

@media (max-width:760px){
  :root{--lw:180px}
  h1{font-size:1.6rem}
  .lab .fw{display:none}
}
@media (prefers-reduced-motion:reduce){.panel,.scrim{transition:none}}

/* ---- production additions ---- */
.tags{display:flex;gap:.5rem;flex-wrap:wrap}
.counts{opacity:.7;margin-left:.35rem;font-size:.78rem}
.seg button.zero,.fwb.zero{opacity:.45}
.row-ctl label{display:flex;flex-direction:column;gap:.15rem;font-size:.78rem;color:var(--muted)}
.row-ctl .field{min-width:10.5rem}
.search{min-width:15rem}
.active-bar{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;min-height:2rem}
.active-bar .sum{color:var(--text2);font-size:.92rem;margin-right:.25rem}
.pill{display:inline-flex;align-items:center;gap:.4rem;background:var(--surface);border:1px solid var(--border-strong);border-radius:999px;padding:.15rem .3rem .15rem .7rem;font-size:.85rem;color:var(--text);cursor:pointer}
.pill:hover{border-color:var(--accent)}
.pill b{display:inline-flex;align-items:center;justify-content:center;width:1.2rem;height:1.2rem;border-radius:50%;background:var(--card);font-weight:700;line-height:1}
.state{padding:3rem 1.5rem;text-align:center;color:var(--text2)}
.state h2{margin:0 0 .4rem;font-size:1.3rem;font-weight:700;color:var(--text)}
.state p{margin:0 0 1rem;color:var(--muted)}
.state .btn{background:linear-gradient(135deg,#67EADD,#22DBC8);color:var(--on-accent);border:none;border-radius:.5rem;padding:.5rem 1.1rem;font-weight:700;cursor:pointer}
.skel{padding:1rem}
.skel i{display:block;height:2.4rem;margin:.6rem 0;border-radius:.5rem;background:linear-gradient(90deg,var(--surface),var(--row-hover),var(--surface));background-size:200% 100%;animation:sh 1.4s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.ptools{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin:0 5rem .5rem 0}
.ptools button{background:transparent;border:1px solid var(--border);border-radius:.5rem;padding:.3rem .65rem;cursor:pointer;color:var(--text2);font-size:.88rem}
.ptools button:hover:not(:disabled){border-color:var(--border-strong)}
.ptools button:disabled{opacity:.4;cursor:default}
.ptools .msg{color:var(--muted);font-size:.82rem}
.panel .close{z-index:2}
.group.q>span .dot{background:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hint-keys{color:var(--muted);font-size:.8rem}
@media print{
  body{background:#fff;color:#111}
  .controls,.fws .hint,.panel,.scrim,.tag,.legend .hint-keys{display:none!important}
  .plot{min-width:0}.scroll{overflow:visible}
  .gantt,.fws,.tbc,.metric{border-color:#bbb;background:#fff}
  .row .lab{background:#fff}
}
</style>

const DATA_URL = "";

function loadActivities(){
  if (!DATA_URL) return Promise.resolve({ activities: ACTIVITIES, generatedAt: null, sample: true });
  return fetch(DATA_URL, { cache: "no-store", credentials: "same-origin" })
    .then(r => { if (!r.ok) throw new Error("The calendar data could not be loaded (HTTP " + r.status + ")."); return r.json(); })
    .then(j => Array.isArray(j) ? { activities: j } : j);
}

const DAY = 86400000;
const ISO = /^\d{4}-\d{2}-\d{2}$/;
const d = s => { const [y,m,dd] = s.split("-").map(Number); return new Date(y, m-1, dd); };
const fmt = (dt, y) => dt.toLocaleDateString("en-US", y ? {month:"short",day:"numeric",year:"numeric"} : {month:"short",day:"numeric"});
const today = (() => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); })();
const span = w => Math.round((d(w[1]) - d(w[0])) / DAY) + 1;
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);

const STATUS_OPTS = [["","Any status"],["now","In progress now"],["next","Upcoming"],["done","Completed"],["tbc","Dates to be confirmed"]];
const GROUP_OPTS = [["type","Activity type"],["quarter","Start quarter"]];
const winState = w => today > d(w[1]) ? "done" : (today >= d(w[0]) ? "now" : "next");
const stateLabel = { done:"Completed", now:"In progress", next:"Scheduled", tbc:"Dates to be confirmed" };

/* ---------- data hygiene ---------- */
function normalize(raw){
  const seen = new Set(), out = []; let bad = 0;
  (Array.isArray(raw) ? raw : []).forEach(r => {
    if (!r || typeof r !== "object" || !r.id || !r.name || !TYPES[r.type] || seen.has(String(r.id))) { bad++; return; }
    seen.add(String(r.id));
    const arr = v => Array.isArray(v) ? v.map(String) : [];
    const windows = (Array.isArray(r.windows) ? r.windows : [])
      .filter(w => Array.isArray(w) && ISO.test(w[0]) && ISO.test(w[1]) && d(w[0]) <= d(w[1]))
      .sort((x, y) => d(x[0]) - d(y[0]));
    const a = {
      id:String(r.id), name:String(r.name), type:r.type,
      basis: r.basis === "confirmed" ? "confirmed" : "indicative",
      owner:String(r.owner || "GRC"), cadence:String(r.cadence || ""), source:String(r.source || ""),
      summary:String(r.summary || ""), frameworks:arr(r.frameworks), drivers:arr(r.drivers),
      requirements:arr(r.requirements), evidence:arr(r.evidence), windows,
      teams:(Array.isArray(r.teams) ? r.teams : []).filter(t => t && t.n).map(t => ({ n:String(t.n), a:String(t.a || "") }))
    };
    a._hay = [a.name, a.summary, a.cadence, a.owner, a.frameworks.join(" "), a.requirements.join(" "),
      a.teams.map(t => t.n + " " + t.a).join(" "), TYPES[a.type].name].join(" ").toLowerCase();
    out.push(a);
  });
  if (bad) console.warn(bad + " activity record(s) were skipped because they were incomplete, duplicated or had an unknown type.");
  return out;
}

/* ---------- filtering: one function decides, everything else reads it ---------- */
const rangeOf = key => key === "FY" ? [d(FY.start), d(FY.end)] : (q => [d(q.s), d(q.e)])(QUARTERS.find(x => x.k === key));
const inRange = (a, key) => key === "FY" || (r => a.windows.some(w => d(w[1]) >= r[0] && d(w[0]) <= r[1]))(rangeOf(key));
const hasStatus = (a, s) => s === "tbc" ? !a.windows.length : a.windows.some(w => winState(w) === s);
function matches(a, skip){
  if (skip !== "types"  && state.types.size && !state.types.has(a.type)) return false;
  if (skip !== "team"   && state.team && !a.teams.some(t => t.n === state.team)) return false;
  if (skip !== "fw"     && state.fw && !a.frameworks.includes(state.fw)) return false;
  if (skip !== "status" && state.status && !hasStatus(a, state.status)) return false;
  if (skip !== "q"      && qTokens.length && !qTokens.every(t => a._hay.includes(t))) return false;
  return true;
}
const visibleList = () => DATA.filter(a => matches(a) && inRange(a, state.range));
const countWhere = (skip, extra, rangeKey) => DATA.filter(a => matches(a, skip) && inRange(a, rangeKey || state.range) && extra(a)).length;
const filtersActive = () => state.range !== "FY" || state.types.size || state.team || state.fw || state.status || state.q.trim();

/* ---------- URL state ---------- */
function writeHash(){
  const p = new URLSearchParams();
  if (state.range !== "FY") p.set("r", state.range);
  if (state.types.size) p.set("t", [...state.types].join(","));
  if (state.team) p.set("team", state.team);
  if (state.fw) p.set("fw", state.fw);
  if (state.status) p.set("st", state.status);
  if (state.q.trim()) p.set("q", state.q.trim());
  if (state.group !== "type") p.set("g", state.group);
  if (state.open) p.set("a", state.open);
  const h = p.toString();
  try { history.replaceState(null, "", h ? "#" + h : location.pathname + location.search); } catch (e) { /* sandboxed frames may refuse */ }
}
function readHash(){
  let p; try { p = new URLSearchParams(location.hash.replace(/^#/, "")); } catch (e) { return; }
  const r = p.get("r"); state.range = RANGE_KEYS.includes(r) ? r : "FY";
  state.types = new Set((p.get("t") || "").split(",").filter(k => TYPES[k]));
  const teams = new Set(DATA.flatMap(a => a.teams.map(t => t.n)));
  state.team = teams.has(p.get("team")) ? p.get("team") : "";
  state.fw = FRAMEWORKS.some(f => f.n === p.get("fw")) ? p.get("fw") : "";
  state.status = STATUS_OPTS.some(o => o[0] && o[0] === p.get("st")) ? p.get("st") : "";
  state.q = (p.get("q") || "").slice(0, 100);
  state.group = p.get("g") === "quarter" ? "quarter" : "type";
  state.open = DATA.some(a => a.id === p.get("a")) ? p.get("a") : null;
}

/* ---------- controls ---------- */
function setOptions(sel, opts, value){
  const html = opts.map(o => `<option value="${esc(o[0])}">${esc(o[1])}</option>`).join("");
  if (sel.__h !== html) { sel.innerHTML = html; sel.__h = html; }
  sel.value = value;
}
function renderQTabs(){
  const cq = currentQuarter();
  const tabs = [{k:"FY", t:"Full year", s:""}].concat(QUARTERS.map(q => ({k:q.k, t:q.k, s:q.m + (cq && cq.k === q.k ? ", current" : "")})));
  $("qTabs").innerHTML = tabs.map(t => {
    const n = countWhere(null, () => true, t.k);
    return `<button type="button" data-k="${t.k}" data-fk="qt:${t.k}" aria-pressed="${state.range === t.k}" class="${n ? "" : "zero"}">${t.t}${t.s ? `<small>${t.s}</small>` : ""}<span class="counts">${n}</span></button>`;
  }).join("");
}
function renderTypeChips(){

  }).join("");
}
function renderSelects(){

  setOptions($("teamSel"), [["", "All teams"]].concat(teams.map(t => [t, `${t} (${countWhere("team", a => a.teams.some(x => x.n === t))})`])), state.team);
  setOptions($("fwSel"), [["", "All frameworks"]].concat(FRAMEWORKS.map(f => [f.n, `${f.n} (${countWhere("fw", a => a.frameworks.includes(f.n))})`])), state.fw);
  setOptions($("statusSel"), STATUS_OPTS.map(o => [o[0], o[0] ? `${o[1]} (${countWhere("status", a => hasStatus(a, o[0]))})` : o[1]]), state.status);
  setOptions($("groupSel"), GROUP_OPTS, state.group);
}
function renderFrameworks(){
  $("fws").innerHTML = `<h2>Frameworks and regulations in scope</h2><p class="hint">Select one to see only the activities that support it. Counts reflect your other filters.</p>` +
    FW_GROUPS.map(g => `<div class="fg"><span class="gl2" style="--c:${g.c}"><i></i>${g.t}</span>` +
      FRAMEWORKS.filter(f => f.status === g.k).map(f => {

        return `<button type="button" class="fwb ${n || state.fw === f.n ? "" : "zero"}" style="--c:${g.c}" data-n="${esc(f.n)}" data-fk="fw:${esc(f.n)}" title="${esc(f.note)}" aria-pressed="${state.fw === f.n}">${esc(f.n)}<span class="counts">${n}</span></button>`;
      }).join("") + `</div>`).join("");
}
function renderActive(list){
  const pills = [];
  if (state.range !== "FY") pills.push(["range", "Period: " + state.range]);
  state.types.forEach(k => pills.push(["type:" + k, TYPES[k].name]));
  if (state.team) pills.push(["team", "Team: " + state.team]);
  if (state.fw) pills.push(["fw", "Framework: " + state.fw]);
  if (state.status) pills.push(["status", "Status: " + STATUS_OPTS.find(o => o[0] === state.status)[1]]);
  if (state.q.trim()) pills.push(["q", "Search: " + state.q.trim()]);
  $("activeBar").innerHTML = `<span class="sum">Showing ${list.length} of ${DATA.length} activities</span>` +
    pills.map(p => `<button type="button" class="pill" data-clear="${esc(p[0])}" data-fk="pill:${esc(p[0])}" aria-label="Remove filter ${esc(p[1])}">${esc(p[1])}<b aria-hidden="true">×</b></button>`).join("") +
    (pills.length > 1 ? `<button type="button" class="link" data-clear="all" data-fk="pill:all">Clear all</button>` : "");
}
function clearFilter(k){
  if (k === "all") { state.range = "FY"; state.types.clear(); state.team = ""; state.fw = ""; state.status = ""; state.q = ""; $("q").value = ""; }
  else if (k === "range") state.range = "FY";
  else if (k === "team") state.team = "";
  else if (k === "fw") state.fw = "";
  else if (k === "status") state.status = "";
  else if (k === "q") { state.q = ""; $("q").value = ""; }
  else if (k.startsWith("type:")) state.types.delete(k.slice(5));
  update();
}

/* ---------- summary ---------- */
function currentQuarter(){ return QUARTERS.find(q => today >= d(q.s) && today <= d(q.e)); }
function renderMetrics(){
  const base = DATA.filter(a => matches(a));
  const now = [], soon = [];
  base.forEach(a => {
    if (a.windows.some(w => today >= d(w[0]) && today <= d(w[1]))) now.push(a.name);
    const nx = a.windows.find(w => d(w[0]) > today && d(w[0]) - today <= 30 * DAY);
    if (nx) soon.push(a.name + " (" + fmt(d(nx[0])) + ")");
  });
  const cq = currentQuarter();
  const list = a => a.length ? a.slice(0, 2).join("; ") + (a.length > 2 ? `; and ${a.length - 2} more` : "") : "Nothing scheduled";
  const note = filtersActive() ? " (filtered)" : "";
  $("metrics").innerHTML = `
    <div class="metric" style="--c:#10B981"><div class="k">In progress now${note}</div><div class="v">${now.length}</div><div class="n">${esc(list(now))}</div></div>
    <div class="metric" style="--c:#F59E0B"><div class="k">Starting in the next 30 days${note}</div><div class="v">${soon.length}</div><div class="n">${esc(list(soon))}</div></div>
    <div class="metric" style="--c:#67EADD"><div class="k">Current fiscal quarter</div><div class="v">${cq ? cq.k : "None"}</div><div class="n">${cq ? cq.m : "Outside this fiscal year"}</div></div>`;
}

/* ---------- gantt ---------- */
function rowHtml(a, ws, tv, pct, total, rs, re){
  const bars = ws.map(w => {
    const s = d(w[0]) < rs ? rs : d(w[0]), e = d(w[1]) > re ? re : d(w[1]);
    const left = pct(s), width = ((e - s) / DAY + 1) / total * 100, st = winState(w);
    const label = width > 15 ? fmt(d(w[0])) + " to " + fmt(d(w[1])) : "";
    return `<span class="bar ${st}${a.basis === "confirmed" ? "" : " ind"}" aria-hidden="true" style="--c:${tv.c};left:${left}%;width:${width}%" title="${stateLabel[st]}${a.basis === "confirmed" ? "" : " (indicative dates)"}: ${fmt(d(w[0]), true)} to ${fmt(d(w[1]), true)}">${label}</span>`;
  }).join("");
  const aria = `${a.name}. ${ws.map(w => fmt(d(w[0]), true) + " to " + fmt(d(w[1]), true)).join("; ")}. ${a.basis === "confirmed" ? "Dates confirmed" : "Indicative dates"}. Opens details.`;
  return `<button type="button" class="row" data-id="${esc(a.id)}" data-fk="row:${esc(a.id)}" aria-label="${esc(aria)}" aria-expanded="${state.open === a.id}" aria-controls="panel">
    <span class="lab"><span class="nm">${esc(a.name)}</span><span class="fw">${esc(a.frameworks.join(", "))}</span></span>
    <span class="track">${bars}</span></button>`;
}
function renderGantt(list){
  const [rs, re] = rangeOf(state.range);
  const total = (re - rs) / DAY + 1;
  const pct = dt => ((dt - rs) / DAY) / total * 100;

  const months = [];
  for (let c = new Date(rs.getFullYear(), rs.getMonth(), 1); c <= re; c = new Date(c.getFullYear(), c.getMonth() + 1, 1)){
    const s = c < rs ? rs : c, e = new Date(Math.min(new Date(c.getFullYear(), c.getMonth() + 1, 1) - DAY, re));
    months.push({ s, days:(e - s) / DAY + 1, lab:c.toLocaleDateString("en-US", {month:"short"}) + (c.getMonth() === 0 || !months.length ? " " + c.getFullYear() : "") });
  }
  const cq = currentQuarter();
  const qs = state.range === "FY" ? QUARTERS : QUARTERS.filter(q => q.k === state.range);
  const hdr = `<div class="hdr"><div class="corner">Activity</div><div class="cols">
    <div class="qrow">${qs.map(q => `<div class="${cq && cq.k === q.k ? "cur" : ""}" style="flex:${(d(q.e) - d(q.s)) / DAY + 1}">${q.k}<span>${q.m}</span></div>`).join("")}</div>
    <div class="mrow">${months.map(m => `<div style="flex:${m.days}">${m.lab}</div>`).join("")}</div></div></div>`;

  const items = list.filter(a => a.windows.length).map(a => ({ a, ws:a.windows.filter(w => d(w[1]) >= rs && d(w[0]) <= re) })).filter(r => r.ws.length);
  items.sort((x, y) => d(x.ws[0][0]) - d(y.ws[0][0]) || x.a.name.localeCompare(y.a.name));
  VISIBLE = [];
  let body = "";
  if (state.group === "quarter") {
    const buckets = new Map(qs.map(q => [q.k, []]));
    items.forEach(it => {
      const first = d(it.ws[0][0]) < rs ? rs : d(it.ws[0][0]);
      const q = qs.find(q => first >= d(q.s) && first <= d(q.e)) || qs[0];
      buckets.get(q.k).push(it);
    });
    qs.forEach(q => {
      const rows = buckets.get(q.k); if (!rows.length) return;
      body += `<div class="group q"><span><i class="dot"></i>Starts in ${q.k}, ${q.m}<span class="ct">${rows.length}</span></span></div>`;
      rows.forEach(it => { VISIBLE.push(it.a.id); body += rowHtml(it.a, it.ws, TYPES[it.a.type], pct, total, rs, re); });
    });
  } else {
    Object.entries(TYPES).forEach(([tk, tv]) => {
      const rows = items.filter(it => it.a.type === tk); if (!rows.length) return;
      body += `<div class="group" style="--c:${tv.c}"><span><i class="dot"></i>${esc(tv.name)}<span class="ct">${rows.length}</span></span></div>`;
      rows.forEach(it => { VISIBLE.push(it.a.id); body += rowHtml(it.a, it.ws, tv, pct, total, rs, re); });
    });
  }

  const tb = state.range === "FY" ? list.filter(a => !a.windows.length) : [];
  tb.forEach(a => VISIBLE.push(a.id));
  if (!items.length) {
    body = `<div class="state"><h2>${list.length ? "Nothing is scheduled in this period" : "No activities match these filters"}</h2>
      <p>${filtersActive() ? "Try removing a filter or choosing a different quarter." : "There are no activities to show."}</p>
      ${filtersActive() ? `<button type="button" class="btn" data-clear="all" data-fk="pill:all">Clear all filters</button>` : ""}</div>`;
  }
  let lines = months.slice(1).map(m => `<i class="gl" style="--p:${pct(m.s) / 100}"></i>`).join("");
  if (today >= rs && today <= re) lines += `<i class="today" style="--p:${(pct(today) + 50 / total) / 100}"></i>`;
  $("plot").innerHTML = hdr + body + lines;

  const tbEl = $("tbc");
  tbEl.hidden = !tb.length;
  tbEl.innerHTML = tb.length ? `<h2>Dates to be confirmed (${tb.length})</h2><p>These activities are in scope but have no dates yet. GRC adds them in the data table and they move onto the chart.</p>` +
    tb.map(a => `<button type="button" class="tbcrow" data-id="${esc(a.id)}" data-fk="row:${esc(a.id)}" aria-expanded="${state.open === a.id}" aria-controls="panel"><span class="nm"><i class="dot" style="--c:${TYPES[a.type].c}"></i>${esc(a.name)}</span><span class="cd">${esc(a.cadence)}</span></button>`).join("") : "";
}

/* ---------- the single render pipeline ---------- */
function update(){
  const act = document.activeElement, fk = act && act.dataset ? act.dataset.fk : null;
  qTokens = state.q.toLowerCase().split(/\s+/).filter(Boolean);
  const list = visibleList();
  renderQTabs(); renderTypeChips(); renderSelects(); renderFrameworks();
  renderMetrics(); renderGantt(list); renderActive(list);
  writeHash();
  if (fk) { const el = [...document.querySelectorAll("[data-fk]")].find(e => e.dataset.fk === fk); if (el && el !== document.activeElement) el.focus({ preventScroll:true }); }
  syncNav();
}

/* ---------- detail panel ---------- */
const panel = $("panel"), scrim = $("scrim"), app = $("app");
function renderPanel(a){
  const t = TYPES[a.type];
  const states = a.windows.map(winState);
  const overall = !states.length ? "tbc" : (states.includes("now") ? "now" : (states.includes("next") ? "next" : "done"));
  const cd = w => {
    const s = d(w[0]), e = d(w[1]);
    if (today < s) { const n = Math.round((s - today) / DAY); return `Starts in ${n} day${n === 1 ? "" : "s"}`; }
    if (today <= e) { const n = Math.round((e - today) / DAY); return `${n} day${n === 1 ? "" : "s"} left`; }
    return "Finished";
  };
  const li = arr => arr.length ? `<ul>${arr.map(r => `<li>${esc(r)}</li>`).join("")}</ul>` : `<p class="lead">None listed.</p>`;
  $("pBody").innerHTML = `
    <div class="badges" style="margin-top:0">
      <span class="badge" style="--c:${t.c}"><i class="dot"></i>${esc(t.name)}</span>
      <span class="badge solid" style="--c:${overall === "now" ? "#10B981" : overall === "next" ? "#06B6D4" : overall === "tbc" ? "#F59E0B" : "#C0C0C0"}">${stateLabel[overall]}</span>
      ${a.windows.length ? `<span class="badge" style="--c:${a.basis === "confirmed" ? "#10B981" : "#F59E0B"}">${a.basis === "confirmed" ? "Dates confirmed by GRC" : "Indicative dates, to be confirmed"}</span>` : ""}
    </div>
    <h2 id="pTitle">${esc(a.name)}</h2>
    <p class="lead">${esc(a.summary)}</p>
    <h3>Schedule this fiscal year</h3>
    ${!a.windows.length ? `<p class="lead">No dates set yet.${a.cadence ? " Cadence: " + esc(a.cadence) + "." : ""}</p>` : ""}
    ${a.windows.map(w => { const q = QUARTERS.find(q => d(w[0]) >= d(q.s) && d(w[0]) <= d(q.e)); const st = winState(w);
      const one = w[0] === w[1];
      return `<div class="win" style="--c:${t.c}"><div><div class="when">${one ? fmt(d(w[0]), true) : fmt(d(w[0]), true) + " to " + fmt(d(w[1]), true)}</div><div class="len">${q ? q.k + ", " : ""}${one ? "milestone" : span(w) + " days"}</div></div><div class="len" style="text-align:right">${stateLabel[st]}<br>${cd(w)}</div></div>`; }).join("")}
    <h3>Why this is required</h3>${li(a.drivers)}
    <h3>What is required</h3>${li(a.requirements)}
    <h3>Teams involved and what they do</h3>
    ${a.teams.length ? a.teams.map(tm => `<div class="team"><b>${esc(tm.n)}</b><span>${esc(tm.a)}</span></div>`).join("") : `<p class="lead">None listed.</p>`}
    <h3>Evidence produced</h3>${li(a.evidence)}
    <h3>Details</h3>
    <dl class="kv"><dt>GRC owner</dt><dd>${esc(a.owner)}</dd><dt>Cadence</dt><dd>${esc(a.cadence || "Not set")}</dd><dt>Source</dt><dd>${esc(a.source || "Not set")}</dd>
    <dt>Frameworks</dt><dd>${a.frameworks.map(f => `<span class="badge" style="margin:0 .3rem .3rem 0">${esc(f)}</span>`).join("")}</dd></dl>
    <p class="fine">Frameworks come from Workato's published compliance documentation. Requirement references are for orientation and should be validated by GRC.</p>`;
}
function syncNav(){
  const i = VISIBLE.indexOf(state.open);
  $("pPrev").disabled = !state.open || i <= 0;
  $("pNext").disabled = !state.open || i < 0 || i >= VISIBLE.length - 1;
}
function showDetail(id){
  const a = DATA.find(x => x.id === id); if (!a) return;
  state.open = id; renderPanel(a); panel.scrollTop = 0; $("pMsg").textContent = "";
}
function openDetail(id){
  showDetail(id); update();
  panel.classList.add("open"); scrim.classList.add("open");
  panel.setAttribute("aria-hidden", "false"); app.setAttribute("inert", "");
  $("pClose").focus();
}
function closeDetail(){
  const id = state.open; if (!id) return;
  state.open = null;
  panel.classList.remove("open"); scrim.classList.remove("open");
  panel.setAttribute("aria-hidden", "true"); app.removeAttribute("inert");
  update();
  const back = [...document.querySelectorAll("[data-fk]")].find(e => e.dataset.fk === "row:" + id);
  if (back) back.focus();
}
function stepDetail(delta){
  const i = VISIBLE.indexOf(state.open), n = VISIBLE[i + delta];
  if (n) { showDetail(n); update(); }
}

/* ---------- states ---------- */
function showLoading(){ $("plot").innerHTML = `<div class="skel" role="status" aria-label="Loading calendar"><i></i><i></i><i></i><i></i><i></i></div>`; }
function showError(err){
  console.error(err);
  $("plot").innerHTML = `<div class="state" role="alert"><h2>The calendar could not be loaded</h2><p>${esc(err && err.message ? err.message : "Something went wrong.")} Check your connection and try again.</p><button type="button" class="btn" id="retry">Try again</button></div>`;
  $("retry").onclick = init;
}

/* ---------- wiring (once) ---------- */
function build(){
  if (built) return; built = true;
  $("fyLabel").textContent = FY.label;
  let t = null;
  $("q").addEventListener("input", e => { clearTimeout(t); const v = e.target.value; t = setTimeout(() => { state.q = v; update(); }, 120); });
  $("teamSel").onchange = e => { state.team = e.target.value; update(); };
  $("fwSel").onchange = e => { state.fw = e.target.value; update(); };
  $("statusSel").onchange = e => { state.status = e.target.value; update(); };
  $("groupSel").onchange = e => { state.group = e.target.value; update(); };
  $("qTabs").onclick = e => { const b = e.target.closest("button"); if (!b) return; state.range = b.dataset.k; update(); };
  $("typeChips").onclick = e => { const b = e.target.closest("button"); if (!b) return; const k = b.dataset.k; state.types.has(k) ? state.types.delete(k) : state.types.add(k); update(); };
  $("fws").onclick = e => { const b = e.target.closest(".fwb"); if (!b) return; state.fw = state.fw === b.dataset.n ? "" : b.dataset.n; update(); };
  $("activeBar").onclick = e => { const b = e.target.closest("[data-clear]"); if (b) clearFilter(b.dataset.clear); };
  $("plot").addEventListener("click", e => {
    const c = e.target.closest("[data-clear]"); if (c) { clearFilter(c.dataset.clear); return; }
    const r = e.target.closest(".row"); if (r) state.open === r.dataset.id ? closeDetail() : openDetail(r.dataset.id);
  });
  $("tbc").addEventListener("click", e => { const r = e.target.closest(".tbcrow"); if (r) state.open === r.dataset.id ? closeDetail() : openDetail(r.dataset.id); });
  $("pClose").onclick = closeDetail; scrim.onclick = closeDetail;
  $("pPrev").onclick = () => stepDetail(-1); $("pNext").onclick = () => stepDetail(1);
  $("pCopy").onclick = () => {
    const m = $("pMsg");
    try { navigator.clipboard.writeText(location.href).then(() => m.textContent = "Link copied", () => m.textContent = "Copy the link from your browser's address bar"); }
    catch (e) { m.textContent = "Copy the link from your browser's address bar"; }
  };
  document.addEventListener("keydown", e => {
    const inField = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
    if (e.key === "Escape") {
      if (state.open) closeDetail();
      else if (document.activeElement === $("q") && $("q").value) { $("q").value = ""; state.q = ""; update(); }
    } else if (e.key === "/" && !inField && !state.open) { e.preventDefault(); $("q").focus(); }
    else if ((e.key === "ArrowDown" || e.key === "ArrowUp") && /\b(row|tbcrow)\b/.test(document.activeElement.className || "")) {
      const rows = [...document.querySelectorAll(".row,.tbcrow")], i = rows.indexOf(document.activeElement);
      const n = rows[i + (e.key === "ArrowDown" ? 1 : -1)]; if (n) { e.preventDefault(); n.focus(); }
    } else if (e.key === "Tab" && state.open) {
      const f = [...panel.querySelectorAll("button:not(:disabled),a[href],[tabindex]:not([tabindex='-1'])")]; if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && (document.activeElement === first || document.activeElement === panel)) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
  window.addEventListener("hashchange", () => { if (!DATA.length) return; readHash(); $("q").value = state.q; update(); if (state.open) openDetail(state.open); else if (panel.classList.contains("open")) closeDetail(); });
}

function init(){
  showLoading();
  loadActivities().then(res => {
    META = res || {};
    DATA = normalize(META.activities);
    if (!DATA.length) throw new Error("No activities were found in the calendar data.");
    readHash(); build();
    $("q").value = state.q;
    const tags = [];
    if (META.generatedAt && !isNaN(new Date(META.generatedAt))) tags.push(`Data updated ${fmt(new Date(META.generatedAt), true)}`);
    else if (META.sample) tags.push("Sample data");
    if (DATA.some(a => a.basis !== "confirmed")) tags.push("Striped bars are indicative dates to be confirmed by GRC");
    $("tags").innerHTML = tags.map(x => `<span class="tag">${esc(x)}</span>`).join("");
    update();
    if (state.open) openDetail(state.open);
  }).catch(showError);
}
init();

</script>
</body>
